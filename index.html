<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPERRO DPP Association Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#14171A; --panel:#1D2125; --panel2:#22272C; --line:#323A40;
    --ink:#ECEEEF; --ink-dim:#8D979E;
    --brand:#7A2340; --brand-light:#A6335A;
    --pass:#2E8B57; --pass-bg:#183324;
    --fail:#C0392B; --fail-bg:#3A1F1D;
    --warn:#C98A2E; --warn-bg:#332711;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--sans); height:100%;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  header{
    background:linear-gradient(180deg,#20141A,#14171A);
    border-bottom:1px solid var(--line);
    padding:14px 18px 10px;
    position:sticky; top:0; z-index:20;
  }
  .brand-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .brand{font-size:15px; letter-spacing:.04em; font-weight:700; color:var(--ink);}
  .brand small{display:block; font-weight:400; color:var(--ink-dim); font-size:11.5px; letter-spacing:.02em; margin-top:2px;}
  .runid{font-family:var(--mono); font-size:11px; color:var(--ink-dim); text-align:right;}
  nav{display:flex; gap:4px; margin-top:12px; overflow-x:auto;}
  nav button{
    flex:1; min-width:78px; background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    padding:9px 6px; border-radius:8px; font-size:12.5px; font-weight:600; font-family:var(--sans);
  }
  nav button.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  main{padding:16px; max-width:820px; margin:0 auto;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px;}
  h2{font-size:14px; margin:0 0 12px; color:var(--ink); font-weight:700;}
  h3{font-size:13px; margin:0 0 8px; color:var(--ink-dim); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  p.hint{color:var(--ink-dim); font-size:12.5px; line-height:1.5; margin:0 0 12px;}
  label{display:block; font-size:12px; color:var(--ink-dim); margin-bottom:5px; font-weight:600;}
  input[type=text], input[type=number], select{
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    padding:11px 12px; border-radius:8px; font-size:15px; font-family:var(--sans); margin-bottom:10px;
  }
  input:focus, select:focus{outline:none; border-color:var(--brand-light);}
  button.btn{
    border:none; border-radius:8px; padding:12px 16px; font-size:14px; font-weight:700;
    font-family:var(--sans); cursor:pointer;
  }
  .btn-primary{background:var(--brand); color:#fff; width:100%;}
  .btn-primary:active{background:var(--brand-light);}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .btn-pass{background:var(--pass); color:#fff;}
  .btn-fail{background:var(--fail); color:#fff;}
  .btn-sm{padding:7px 10px; font-size:12px; border-radius:6px;}
  .row{display:flex; gap:8px;}
  .row > *{flex:1;}
  .size-row{display:grid; grid-template-columns:1fr 1fr 74px 34px; gap:8px; align-items:center; margin-bottom:8px;}
  .size-row input{margin-bottom:0;}
  .size-row .rm{background:var(--fail-bg); color:var(--fail); border:1px solid var(--fail); border-radius:6px; height:40px;}
  .edit-size-row{display:grid; grid-template-columns:1fr 1fr 74px 28px; gap:6px; align-items:center; margin-bottom:6px; font-size:12.5px;}
  .edit-size-row .rm{background:transparent; color:var(--ink-dim); border:none; font-size:15px;}
  .mono{font-family:var(--mono);}
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:4px;}
  .stat{background:var(--panel2); border-radius:8px; padding:10px; text-align:center;}
  .stat .n{font-size:20px; font-weight:800;}
  .stat .l{font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}
  #scan-video{width:100%; border-radius:10px; background:#000; display:block; aspect-ratio:4/3; object-fit:cover;}
  .scan-wrap{position:relative;}
  .scan-frame{position:absolute; inset:0; border:2px solid rgba(255,255,255,.18); border-radius:10px; pointer-events:none;}
  .scan-box{position:absolute; top:50%; left:50%; width:62%; aspect-ratio:1/1; transform:translate(-50%,-50%); border:2px solid var(--brand-light); border-radius:12px; box-shadow:0 0 0 999px rgba(0,0,0,.28);}
  .scan-box::before{content:""; position:absolute; top:0; left:0; right:0; height:2px; background:var(--brand-light); box-shadow:0 0 8px var(--brand-light); animation:sweep 1.8s linear infinite;}
  @keyframes sweep{0%{top:6%} 50%{top:94%} 100%{top:6%}}
  .result-card{border-radius:10px; padding:16px; margin-top:12px; border:1px solid var(--line);}
  .result-serial{font-family:var(--mono); font-size:20px; font-weight:700; letter-spacing:.02em; word-break:break-all;}
  .badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
  .badge-wo{background:var(--panel2); color:var(--ink-dim);}
  .badge-pass{background:var(--pass-bg); color:var(--pass);}
  .badge-fail{background:var(--fail-bg); color:var(--fail);}
  .badge-warn{background:var(--warn-bg); color:var(--warn);}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; color:var(--ink-dim); font-weight:600; padding:6px 6px; border-bottom:1px solid var(--line); font-size:11px; text-transform:uppercase; letter-spacing:.02em;}
  td{padding:7px 6px; border-bottom:1px solid var(--line);}
  .progress{height:8px; background:var(--panel2); border-radius:4px; overflow:hidden; margin-top:4px;}
  .progress > div{height:100%; background:var(--pass);}
  .wo-card{border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; background:var(--panel2);}
  .wo-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:10px;}
  .wo-title{font-weight:700; font-size:14px;}
  .wo-sub{font-size:11.5px; color:var(--ink-dim); margin-top:2px;}
  .flag-banner{background:var(--fail-bg); border:1px solid var(--fail); color:#F3B5AE; border-radius:8px; padding:10px 12px; font-size:12.5px; margin-bottom:10px; font-weight:600;}
  .ok-banner{background:var(--pass-bg); border:1px solid var(--pass); color:#9FE0BB; border-radius:8px; padding:10px 12px; font-size:12.5px; margin-bottom:10px; font-weight:600;}
  .empty{color:var(--ink-dim); font-size:13px; text-align:center; padding:24px 10px;}
  .footer-note{color:var(--ink-dim); font-size:11px; text-align:center; padding:20px 10px 30px;}
  .search-box{margin-bottom:10px;}
  .tag-del{color:var(--fail); font-size:11.5px; font-weight:700; background:none; border:none; cursor:pointer;}
  .flex-between{display:flex; justify-content:space-between; align-items:center;}
  .divider{border:none; border-top:1px solid var(--line); margin:14px 0;}
  .tbd{color:var(--ink-dim); font-style:italic;}
  .size-summary-row{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
  .size-summary-row:last-of-type{border-bottom:none;}
  .size-summary-row .ss-left{flex:1; min-width:0;}
  .size-summary-row .ss-counts{color:var(--ink-dim); white-space:nowrap; font-size:12px;}
  .serial-checklist{max-height:260px; overflow-y:auto; margin:2px 0 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel);}
  .serial-checklist table{font-size:11.5px;}
  .serial-checklist th{position:sticky; top:0; background:var(--panel);}
  .check-yes{color:var(--pass); font-weight:700;}
  .check-no{color:var(--ink-dim);}
  ::-webkit-scrollbar{height:0; width:0;}
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <div class="brand">SPERRO DPP ASSOCIATION TRACKER<small>QC Check &middot; Serial &rarr; Work Order Association</small></div>
    <div class="runid" id="run-id-label">—</div>
  </div>
  <nav id="tabs">
    <button data-tab="scan" class="active">Scan</button>

    <button data-tab="workorders">Work Orders</button>
    <button data-tab="log">Log</button>
    <button data-tab="settings">Settings</button>
  </nav>
</header>

<main id="app"></main>

function freshState(){
  return {
    pool: DEFAULT_SERIALS.slice(),     // known serials for this production run (grows via import)
    workOrders: [],                    // {id, woNumber, createdAt, sizes:[{id,colour,size,qty}]}  qty=0 means target not set yet
    assignment: {},                    // serial -> {woId, woNumber, colour, size}
    records: {},                       // serial -> {status:'pass'|'fail', ts, size, woId, woNumber, colour, source:'scan'|'import'}  <- ASSOCIATION status
    qcChecks: {},                      // serial -> {ts, result:'pass'|'fail'}  <- physical QC check event, separate from association source
    writtenOff: {},                    // serial -> {ts, reason:'defect'|'reference', woId, woNumber, colour, size}  <- excluded from needing association
    history: [],                       // [{serial, ts, status, woNumber, size, colour, source}]
    lastAssign: {woId:null, colour:'', size:''}  // remembers the last manual assignment to pre-fill the next one (local-only, not synced)
  };
}

/* ============================= LIVE SYNC (FIREBASE) — declared early so init below can use it ============================= */
const FB_CONFIG_KEY = "arc_dpp_fb_config";
let db = null, syncStatus = 'disconnected', syncError = null, syncListenersAttached = false;

let state = load();
seedDefaultTargets();

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return freshState();
    const parsed = JSON.parse(raw);
    if(!parsed.pool || !Array.isArray(parsed.pool)) return freshState();
    if(!parsed.workOrders) parsed.workOrders = [];
    if(!parsed.assignment) parsed.assignment = {};
    if(!parsed.records) parsed.records = {};
    if(!parsed.qcChecks) parsed.qcChecks = {};
    if(!parsed.writtenOff) parsed.writtenOff = {};
    if(!parsed.history) parsed.history = [];
    if(!parsed.lastAssign) parsed.lastAssign = {woId:null, colour:'', size:''};
    return parsed;
  }catch(e){ return freshState(); }
}
let saveWarningShown = false;
function save(){
  try{
    // Once connected, Firestore already holds workOrders/assignment/records/qcChecks/writtenOff
    // durably — duplicating all of it into localStorage too is what blows the per-origin quota
    // once a run reaches thousands of serials. Only the genuinely local-only bits still need it.
    const toPersist = (syncStatus === 'connected')
      ? { pool: state.pool, history: state.history, lastAssign: state.lastAssign }
      : state;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toPersist));
  }catch(e){
    if(!saveWarningShown){
      saveWarningShown = true;
      alert("Could not save data on this device: " + e.message + (syncStatus==='connected' ? "\n\nLive sync is still connected, so nothing is lost in the cloud — only this device's local backup copy failed." : "\n\nConnect Live sync in Settings to back this up remotely instead of relying on this device's local storage."));
    }
  }
}

/* ============================= LIVE SYNC (FIREBASE) — rest of the engine ============================= */
// Scope: workOrders, assignment, records, qcChecks sync live across devices.
// The serial pool and scan history/log stay local-only — this keeps synced traffic small
// and focused on exactly what needs to match across devices: targets and association status.

function loadFirebaseConfig(){
  try{ const raw = localStorage.getItem(FB_CONFIG_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function saveFirebaseConfig(cfg){ localStorage.setItem(FB_CONFIG_KEY, JSON.stringify(cfg)); }
function clearFirebaseConfig(){ localStorage.removeItem(FB_CONFIG_KEY); }

function initFirebaseSync(config){
  try{
    if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(config);
    db = firebase.firestore();
    attachSyncListeners();
    syncStatus = 'connected'; syncError = null;
  }catch(e){
    db = null; syncStatus = 'error'; syncError = e.message;
  }
  render();
}

function attachSyncListeners(){
  if(!db || syncListenersAttached) return;
  syncListenersAttached = true;
  db.collection('workOrders').onSnapshot(snap=>{
    if(snap.empty && state.workOrders.length){
      const seed = {}; state.workOrders.forEach(wo=>{ seed[wo.id]=wo; });
      pushBatchDocs('workOrders', seed);
      return;
    }
    const wos = [];
    snap.forEach(doc => wos.push(doc.data()));
    state.workOrders = wos;
    save(); render();
  }, err=>{ syncStatus='error'; syncError=err.message; render(); });
  db.collection('assignment').onSnapshot(snap=>{
    if(snap.empty && Object.keys(state.assignment).length){
      pushBatchDocs('assignment', state.assignment);
      return;
    }
    const a = {};
    snap.forEach(doc => a[doc.id] = doc.data());
    state.assignment = a;
    save(); render();
  }, err=>{ syncStatus='error'; syncError=err.message; render(); });
  db.collection('records').onSnapshot(snap=>{
    if(snap.empty && Object.keys(state.records).length){
      pushBatchDocs('records', state.records);
      return;
    }
    const r = {};
    snap.forEach(doc => r[doc.id] = doc.data());
    state.records = r;
    save(); render();
  }, err=>{ syncStatus='error'; syncError=err.message; render(); });
  db.collection('qcChecks').onSnapshot(snap=>{
    if(snap.empty && Object.keys(state.qcChecks).length){
      pushBatchDocs('qcChecks', state.qcChecks);
      return;
    }
    const q = {};
    snap.forEach(doc => q[doc.id] = doc.data());
    state.qcChecks = q;
    save(); render();
  }, err=>{ syncStatus='error'; syncError=err.message; render(); });
  db.collection('writtenOff').onSnapshot(snap=>{
    if(snap.empty && Object.keys(state.writtenOff).length){
      pushBatchDocs('writtenOff', state.writtenOff);
      return;
    }
    const w = {};
    snap.forEach(doc => w[doc.id] = doc.data());
    state.writtenOff = w;
    save(); render();
  }, err=>{ syncStatus='error'; syncError=err.message; render(); });
  // History is an append-only log that any device can add to — merge in cloud entries
  // rather than replacing, so nothing already shown locally ever disappears.
  db.collection('history').orderBy('ts','desc').limit(300).onSnapshot(snap=>{
    const existingKeys = new Set(state.history.map(historyKey));
    let added = false;
    snap.forEach(doc=>{
      const data = doc.data();
      const key = historyKey(data);
      if(!existingKeys.has(key)){
        state.history.push(data);
        existingKeys.add(key);
        added = true;
      }
    });
    if(added){
      state.history.sort((a,b)=>b.ts-a.ts);
      if(state.history.length > 300) state.history.length = 300;
      save(); render();
    }
  }, err=>{ syncStatus='error'; syncError=err.message; render(); });
}

function historyKey(e){ return `${e.serial}__${e.ts}__${e.status}`; }
function pushHistoryEntry(entry){
  state.history.unshift(entry);
  save();
  if(db){
    db.collection('history').doc(historyKey(entry)).set(entry).catch(e=>console.error('sync: push history failed', e));
  }
}

function pushWO(wo){ if(!db || !wo) return; db.collection('workOrders').doc(wo.id).set(wo).catch(e=>console.error('sync: push WO failed', e)); }
function pushAssignment(serial){ if(!db || !state.assignment[serial]) return; db.collection('assignment').doc(serial).set(state.assignment[serial]).catch(e=>console.error('sync: push assignment failed', e)); }
function pushRecord(serial){ if(!db || !state.records[serial]) return; db.collection('records').doc(serial).set(state.records[serial]).catch(e=>console.error('sync: push record failed', e)); }
function pushQcCheck(serial){ if(!db || !state.qcChecks[serial]) return; db.collection('qcChecks').doc(serial).set(state.qcChecks[serial]).catch(e=>console.error('sync: push qcCheck failed', e)); }
function pushWrittenOff(serial){ if(!db || !state.writtenOff[serial]) return; db.collection('writtenOff').doc(serial).set(state.writtenOff[serial]).catch(e=>console.error('sync: push writtenOff failed', e)); }
function pushWrittenOffDelete(serial){ if(!db) return; db.collection('writtenOff').doc(serial).delete().catch(e=>console.error('sync: delete writtenOff failed', e)); }

function writeOffSerial(serial, reason, woId, colour, size){
  const wo = findWO(woId);
  let woNumber = null;
  if(wo && colour && size){
    findOrCreateSizeRow(wo, colour, size);
    state.assignment[serial] = { woId: wo.id, woNumber: wo.woNumber, colour, size };
    woNumber = wo.woNumber;
  }
  state.writtenOff[serial] = { ts: Date.now(), reason, woId: wo?wo.id:null, woNumber, colour: colour||null, size: size||null };
  if(!state.pool.includes(serial)) state.pool.push(serial);
  save();
  pushWrittenOff(serial);
  if(wo && colour && size){ pushAssignment(serial); pushWO(wo); }
}
function undoWriteOff(serial){
  delete state.writtenOff[serial];
  save();
  pushWrittenOffDelete(serial);
}
function pushWODelete(id){ if(!db) return; db.collection('workOrders').doc(id).delete().catch(e=>console.error('sync: delete WO failed', e)); }

function pushBatchDocs(collectionName, docsMap){
  if(!db) return;
  const entries = Object.entries(docsMap);
  const chunkSize = 400;
  for(let i=0; i<entries.length; i+=chunkSize){
    const chunk = entries.slice(i, i+chunkSize);
    const batch = db.batch();
    chunk.forEach(([id, data])=>{ batch.set(db.collection(collectionName).doc(id), data); });
    batch.commit().catch(e=>console.error('sync: batch push failed for '+collectionName, e));
  }
}

/* ============================= HELPERS ============================= */
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtTime(ts){ const d = new Date(ts); return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }

function classifyScan(raw){
  if(!raw) return {kind:'empty'};
  const s = raw.trim();
  try{
    const url = new URL(s);
    const itemId = url.searchParams.get('itemId');
    if(itemId) return {kind:'serial', value: itemId.trim()};
    const segments = url.pathname.split('/').filter(Boolean);
    if(segments.length) return {kind:'serial', value: segments[segments.length-1].trim()};
    // Valid URL, no itemId, no path segments — this is the bare arcteryx.com homepage,
    // which is exactly what the system redirects to for a confirmed non-associated unit.
    return {kind:'confirmedFail'};
  }catch(e){
    if(!s.includes('/')){
      const v = s.split('?')[0].trim();
      return v ? {kind:'serial', value:v} : {kind:'empty'};
    }
    const parts = s.split('/').filter(Boolean);
    const last = (parts[parts.length-1] || '').split('?')[0].trim();
    return last ? {kind:'serial', value:last} : {kind:'empty'};
  }
}
function extractSerial(raw){
  const c = classifyScan(raw);
  return c.kind === 'serial' ? c.value : null;
}
function handleScanInput(raw){
  const c = classifyScan(raw);
  if(c.kind === 'serial'){ showResult(c.value, raw); return true; }
  if(c.kind === 'confirmedFail'){ showConfirmedFail(raw); return true; }
  return false;
}

function poolStats(){
  const total = state.pool.length;
  const assigned = Object.keys(state.assignment).length;
  return {total, assigned, unassigned: total - assigned};
}

const SIZE_NORMALIZE = {
  "double extra large": "XXL", "extra extra large": "XXL", "xxl": "XXL",
  "extra large": "XL", "xl": "XL",
  "large": "L", "l": "L",
  "medium": "M", "m": "M",
  "small": "S", "s": "S",
  "extra small": "XS", "xs": "XS",
};
function normalizeSize(raw){
  const key = String(raw||'').trim().toLowerCase();
  return SIZE_NORMALIZE[key] || String(raw||'').trim();
}

/* ============================= WORK ORDER LOGIC ============================= */
// rows: [{colour, size, qty}]  qty may be 0/blank meaning "target not set yet"
function createWorkOrder(woNumber, rows){
  if(state.workOrders.some(w=>w.woNumber===woNumber)){
    alert(`Work Order ${woNumber} already exists. Edit it directly in the list below instead.`);
    return false;
  }
  const wo = { id: uid(), woNumber: woNumber.trim(), createdAt: Date.now(), sizes: [] };
  rows.forEach(r=>{
    wo.sizes.push({ id: uid(), colour: r.colour.trim(), size: r.size.trim(), qty: +r.qty || 0 });
  });
  state.workOrders.push(wo);
  save();
  return true;
}

// Merges Work Orders that share the same woNumber but ended up with different ids (e.g. from
// repeated re-seeding before IDs were made deterministic). Keeps the oldest as canonical, moves
// any assignment/record pointing at a duplicate over to it, merges size rows, then removes the dupes.
function cleanupDuplicateWorkOrders(){
  const byNumber = {};
  state.workOrders.forEach(wo=>{ (byNumber[wo.woNumber] = byNumber[wo.woNumber] || []).push(wo); });
  const dupGroups = Object.values(byNumber).filter(g=>g.length>1);
  if(!dupGroups.length){ alert('No duplicate Work Orders found.'); return; }

  let mergedCount = 0, reassigned = 0;
  dupGroups.forEach(group=>{
    group.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    const canonical = group[0];
    const dupes = group.slice(1);
    dupes.forEach(dup=>{
      if(!canonical.model && dup.model) canonical.model = dup.model;
      if(!canonical.season && dup.season) canonical.season = dup.season;
      dup.sizes.forEach(dsz=>{
        const existing = canonical.sizes.find(s=>s.colour===dsz.colour && s.size===dsz.size);
        if(existing){
          if(dsz.qty > existing.qty) existing.qty = dsz.qty;
          if(!existing.sku && dsz.sku) existing.sku = dsz.sku;
        } else {
          canonical.sizes.push({...dsz});
        }
      });
      Object.keys(state.assignment).forEach(serial=>{
        if(state.assignment[serial].woId === dup.id){
          state.assignment[serial].woId = canonical.id;
          pushAssignment(serial);
          reassigned++;
        }
      });
      Object.keys(state.records).forEach(serial=>{
        if(state.records[serial].woId === dup.id){
          state.records[serial].woId = canonical.id;
          pushRecord(serial);
        }
      });
      Object.keys(state.writtenOff).forEach(serial=>{
        if(state.writtenOff[serial].woId === dup.id) state.writtenOff[serial].woId = canonical.id;
      });
      state.workOrders = state.workOrders.filter(w=>w.id!==dup.id);
      pushWODelete(dup.id);
      mergedCount++;
    });
    pushWO(canonical);
  });
  save();
  alert(`Merged ${mergedCount} duplicate Work Order(s) across ${dupGroups.length} WO number(s). Reassigned ${reassigned} serial(s) in the process.`);
  render();
}

function deleteWorkOrder(id){
  const wo = state.workOrders.find(w=>w.id===id);
  if(!wo) return;
  if(!confirm(`Delete Work Order ${wo.woNumber}? This clears the assignment and scan records for any serials linked to it. This cannot be undone.`)) return;
  Object.keys(state.assignment).forEach(s=>{
    if(state.assignment[s].woId === id){ delete state.assignment[s]; delete state.records[s]; }
  });
  state.workOrders = state.workOrders.filter(w=>w.id!==id);
  state.history = state.history.filter(h => h.woId !== id);
  save();
  pushWODelete(id);
  render();
}

function findWO(woId){ return state.workOrders.find(w=>w.id===woId); }

// Returns the WO's colour if every size row on it shares the same colour, else null (ambiguous).
function getWOColourGuess(wo){
  if(!wo || !wo.sizes.length) return null;
  const colours = [...new Set(wo.sizes.map(s=>s.colour))];
  return colours.length === 1 ? colours[0] : null;
}

function findOrCreateSizeRow(wo, colour, size, sku){
  let row = wo.sizes.find(s => s.colour===colour && s.size===size);
  if(!row){
    row = { id: uid(), colour, size, qty: 0, sku: sku||null };
    wo.sizes.push(row);
  } else if(sku && !row.sku){
    row.sku = sku;
  }
  return row;
}

// A WO's id is always derived from its own woNumber, never random — so two code paths (or two
// page loads racing before Firestore sync settles) that both try to create the same WO always
// collide into the same document instead of producing a duplicate.
function woDocId(woNumber){
  return 'wo_' + String(woNumber).trim().replace(/[^a-zA-Z0-9_-]/g, '_');
}

function findOrCreateWO(woNumber, model, season){
  let wo = state.workOrders.find(w=>w.woNumber===woNumber);
  if(!wo){
    wo = { id: woDocId(woNumber), woNumber, model: model||null, season: season||null, createdAt: Date.now(), sizes: [] };
    state.workOrders.push(wo);
  } else {
    if(model && !wo.model) wo.model = model;
    if(season && !wo.season) wo.season = season;
    if(wo.season === undefined) wo.season = null; // backfill for WOs created before this field existed
  }
  return wo;
}

// Seeds known target Work Orders on first load only — never overwrites a WO the user already has.
function seedDefaultTargets(){
  if(typeof DEFAULT_TARGET_WORK_ORDERS === 'undefined') return;
  let added = 0;
  DEFAULT_TARGET_WORK_ORDERS.forEach(t=>{
    if(state.workOrders.some(w=>w.woNumber===t.woNumber)) return;
    // Deterministic ID (not a random uid()) — re-seeding always upserts the same document
    // instead of creating a fresh duplicate every time this runs against an empty local cache.
    const wo = { id: woDocId(t.woNumber), woNumber: t.woNumber, model: t.model||null, season: t.season||null, createdAt: Date.now(), sizes: [] };
    t.sizes.forEach(sz=>{
      wo.sizes.push({ id: uid(), colour: sz.colour, size: sz.size, qty: sz.qty||0, sku: sz.sku||null });
    });
    state.workOrders.push(wo);
    pushWO(wo);
    added++;
  });
  if(added) save();
}

function serialsForSizeRow(wo, sizeRow){
  return Object.keys(state.assignment).filter(s => {
    const a = state.assignment[s];
    return a.woId === wo.id && a.colour === sizeRow.colour && a.size === sizeRow.size;
  });
}

function assignSerialToWO(serial, woId, colour, size){
  const wo = findWO(woId);
  if(!wo) return;
  findOrCreateSizeRow(wo, colour, size);
  state.assignment[serial] = { woId: wo.id, woNumber: wo.woNumber, colour, size };
  save();
  pushAssignment(serial);
  pushWO(wo);
}

/* ============================= SCAN LOGIC ============================= */
function lookupSerial(serial){
  const inPool = state.pool.includes(serial);
  const assign = state.assignment[serial];
  const record = state.records[serial];
  return {serial, inPool, assign, record};
}

function markQcChecked(serial, result){
  state.qcChecks[serial] = { ts: Date.now(), result };
  pushQcCheck(serial);
}

function logResult(serial, status, source){
  const assign = state.assignment[serial];
  const rec = {
    status, ts: Date.now(), source: source || 'scan',
    size: assign ? assign.size : null,
    woId: assign ? assign.woId : null,
    woNumber: assign ? assign.woNumber : null,
    colour: assign ? assign.colour : null
  };
  state.records[serial] = rec;
  markQcChecked(serial, status);
  pushHistoryEntry({ serial, ts: rec.ts, status, woNumber: rec.woNumber, size: rec.size, colour: rec.colour, source: rec.source });
  if(!state.pool.includes(serial)) state.pool.push(serial);
  save();
  pushRecord(serial);
}

/* ============================= WO STATS / FLAGGING ============================= */
function sizeStats(wo, sizeRow){
  const serials = serialsForSizeRow(wo, sizeRow);
  let pass=0, fail=0, writtenOff=0;
  serials.forEach(s=>{
    if(state.writtenOff[s]){ writtenOff++; return; } // written-off units are excluded from needing association at all
    const r = state.records[s];
    if(r && r.status==='pass') pass++;
    else if(r && r.status==='fail') fail++;
  });
  const scanned = pass+fail+writtenOff;
  const qty = sizeRow.qty || 0;
  const targetSet = qty > 0;
  const effectiveQty = Math.max(qty - writtenOff, 0); // units actually still expected to be associated
  // Flag: target is known, every unit still expected has been through QC at least once, but pass count is short
  const flagged = targetSet && ((pass+fail) >= effectiveQty) && (pass < effectiveQty);
  return {pass, fail, writtenOff, scanned, qty, effectiveQty, targetSet, flagged, count: serials.length};
}
function woStats(wo){
  const sizes = wo.sizes.map(sz => ({...sz, stats: sizeStats(wo, sz)}));
  const qty = sizes.reduce((a,s)=>a+s.stats.qty,0);
  const pass = sizes.reduce((a,s)=>a+s.stats.pass,0);
  const fail = sizes.reduce((a,s)=>a+s.stats.fail,0);
  const writtenOff = sizes.reduce((a,s)=>a+s.stats.writtenOff,0);
  const effectiveQty = sizes.reduce((a,s)=>a+s.stats.effectiveQty,0);
  const flagged = sizes.some(s=>s.stats.flagged);
  const anyTargetSet = sizes.some(s=>s.stats.targetSet);
  return {sizes, qty, pass, fail, writtenOff, effectiveQty, flagged, anyTargetSet};
}

      <button class="btn btn-ghost btn-sm" id="btn-override-fail" style="width:100%; margin-top:8px;">The DPP link actually failed — flag this one</button>`;
  } else {
    const already = record ? `<div style="margin-top:6px; font-size:12px; color:var(--ink-dim)">Previously logged ${record.status} at ${fmtTime(record.ts)} — recheck below if it has since been fixed on the line.</div>` : '';
    border = record && record.status==='fail' ? 'var(--fail)' : 'var(--line)';

function wireTabEvents(){
  if(activeTab==='scan'){
    const photoOpenInput = document.getElementById('camera-open-input');
    const photoUploadInput = document.getElementById('camera-upload-input');
    const openCameraBtn = document.getElementById('btn-open-camera');
    const uploadPhotoBtn = document.getElementById('btn-upload-photo');
    if(openCameraBtn) openCameraBtn.onclick = () => photoOpenInput.click();
    if(uploadPhotoBtn) uploadPhotoBtn.onclick = () => photoUploadInput.click();
    if(photoOpenInput) photoOpenInput.onchange = handlePhotoCapture;
    if(photoUploadInput) photoUploadInput.onchange = handlePhotoCapture;
    const manualBtn = document.getElementById('btn-manual-lookup');
    const manualInput = document.getElementById('manual-input');
    const noSerialMsg = "Couldn't find a product identifier or link in that — check what you typed or pasted.";
    if(manualBtn) manualBtn.onclick = () => {
      if(!handleScanInput(manualInput.value)) alert(noSerialMsg);
    };
    if(manualInput) manualInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ manualBtn.click(); }});
    if(manualInput) manualInput.addEventListener('paste', ()=>{
      setTimeout(()=>{ if(!handleScanInput(manualInput.value)) alert(noSerialMsg); }, 0);
    });
    const pasteBtn = document.getElementById('btn-paste-clipboard');
    if(pasteBtn) pasteBtn.onclick = async () => {
      try{
        const text = await navigator.clipboard.readText();
        if(!handleScanInput(text)) alert(noSerialMsg);
      }catch(e){
        alert("Couldn't read the clipboard directly (iOS sometimes blocks this outside a fresh tap). Paste into the field above instead.");
      }
    };
    if(currentResultMode === 'result' && currentResultSerial){
      document.getElementById('scan-result').innerHTML = renderResultPanel(currentResultSerial);
      bindResultButtons();
    } else if(currentResultMode === 'confirmedFail'){
      document.getElementById('scan-result').innerHTML = renderConfirmedFailPanel();
      bindConfirmedFailButtons();
    }
  } else if(activeTab==='workorders'){
    bindWorkOrderEvents();
  } else if(activeTab==='dashboard'){
    const dashFilter = document.getElementById('dash-season-filter');
    if(dashFilter) dashFilter.onchange = () => { seasonFilter = dashFilter.value; render(); };
  } else if(activeTab==='log'){
    bindLogEvents();
  } else if(activeTab==='settings'){
    bindSettingsEvents();
  }
}

  if(failBtn) failBtn.onclick = () => { logResult(currentResultSerial,'fail','scan'); currentResultSerial=null; currentResultMode=null; render(); };
  if(rescanBtn) rescanBtn.onclick = () => { currentResultSerial=null; currentResultMode=null; render(); };
  if(overrideBtn) overrideBtn.onclick = () => { logResult(currentResultSerial,'fail','scan'); currentResultSerial=null; currentResultMode=null; render(); };
  if(confirmNotAssocBtn) confirmNotAssocBtn.onclick = () => { logResult(currentResultSerial,'fail','scan'); currentResultSerial=null; currentResultMode=null; render(); };
  if(toggleAssignBtn) toggleAssignBtn.onclick = () => { assignFallbackOpen = !assignFallbackOpen; document.getElementById('scan-result').innerHTML = renderResultPanel(currentResultSerial); bindResultButtons(); };

    document.getElementById('scan-result').innerHTML = renderResultPanel(currentResultSerial);

    const colourInput = document.getElementById('assign-colour');
    if(guess && colourInput) colourInput.value = guess;
  };
}

async function checkDecoderSupport(){
  if(decoderStatus !== 'checking') return;
  const d = await getBarcodeDetector();
  decoderStatus = d ? 'native' : 'fallback';
  if(activeTab==='scan') render();
}

async function getBarcodeDetector(){
  if(barcodeDetector) return barcodeDetector;
  if(typeof BarcodeDetector === 'undefined') return null;
  try{
    const supported = await BarcodeDetector.getSupportedFormats();
    const wanted = ['qr_code','data_matrix','aztec','pdf417','code_128','code_39','code_93','codabar','ean_13','ean_8','upc_a','upc_e','itf'];
    const formats = wanted.filter(f => supported.includes(f));
    if(!formats.length) return null;
    barcodeDetector = new BarcodeDetector({formats});
    return barcodeDetector;
  }catch(e){ return null; }
}

async function startCamera(){
  try{
    videoStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'environment', width:{ideal:1920}, height:{ideal:1080} },
      audio:false
    });
  }catch(e){
    alert("Couldn't access the camera (" + e.message + "). You can still type or paste the serial below.");
    return;
  }
  await getBarcodeDetector();
  const track = videoStream.getVideoTracks()[0];
  torchSupported = false; torchOn = false;
  try{
    const caps = track.getCapabilities && track.getCapabilities();
    torchSupported = !!(caps && caps.torch);
  }catch(e){ torchSupported = false; }
  scanning = true;
  render();
  const video = document.getElementById('scan-video');
  video.srcObject = videoStream;
  video.setAttribute('playsinline', true);
  await video.play();
  attachCameraLoop();
}

async function toggleTorch(){
  if(!videoStream) return;
  const track = videoStream.getVideoTracks()[0];
  try{
    await track.applyConstraints({advanced:[{torch: !torchOn}]});
    torchOn = !torchOn;
    render();
  }catch(e){ /* some devices report torch support but reject the constraint — ignore */ }
}

function stopCamera(){
  scanning = false;
  if(rafId) cancelAnimationFrame(rafId);
  if(videoStream){ videoStream.getTracks().forEach(t=>t.stop()); videoStream = null; }
  torchSupported = false; torchOn = false;
}

function attachCameraLoop(){
  const video = document.getElementById('scan-video');
  const canvas = document.getElementById('scan-canvas');
  if(!video || !canvas) return;
  const ctx = canvas.getContext('2d', {willReadFrequently:true});

  async function tick(){
    if(!scanning) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA && !detectBusy){
      detectBusy = true;
      try{
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        let raw = null;
        const detector = await getBarcodeDetector();
        if(detector){
          try{
            const results = await detector.detect(canvas);
            if(results && results.length) raw = results[0].rawValue;
          }catch(e){ /* fall through to jsQR below */ }
        }
        if(!raw && typeof jsQR !== 'undefined'){
          const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if(code && code.data) raw = code.data;
        }
        const now = Date.now();
        if(raw && (now - lastDecodedAt > 1500)){
          lastDecodedAt = now;
          if(handleScanInput(raw)){
            if(navigator.vibrate) navigator.vibrate(80);
          }
        }
      } finally {
        detectBusy = false;
      }
    }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}

// --- Still-photo capture path: launches the real Camera app via <input capture>,
// then tries several image variants since a still photo affords time a live video frame doesn't. ---
function grayscaleBuffer(imageData){
  const {data, width, height} = imageData;
  const gray = new Uint8ClampedArray(width*height);
  for(let i=0, j=0; i<data.length; i+=4, j++){
    gray[j] = (data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114);
  }
  return gray;
}
function grayToImageData(gray, width, height){
  const out = new ImageData(width, height);
  for(let j=0, i=0; j<gray.length; j++, i+=4){
    out.data[i]=out.data[i+1]=out.data[i+2]=gray[j];
    out.data[i+3]=255;
  }
  return out;
}
function contrastStretch(gray){
  let min=255, max=0;
  for(const v of gray){ if(v<min)min=v; if(v>max)max=v; }
  const range = Math.max(max-min, 1);
  const out = new Uint8ClampedArray(gray.length);
  for(let i=0;i<gray.length;i++) out[i] = ((gray[i]-min) * 255) / range;
  return out;
}
function boxBlur(gray, width, height, radius){
  const out = new Uint8ClampedArray(gray.length);
  for(let y=0;y<height;y++){
    for(let x=0;x<width;x++){
      let sum=0, count=0;
      for(let dy=-radius; dy<=radius; dy++){
        const yy=y+dy; if(yy<0||yy>=height) continue;
        for(let dx=-radius; dx<=radius; dx++){
          const xx=x+dx; if(xx<0||xx>=width) continue;
          sum += gray[yy*width+xx]; count++;
        }
      }
      out[y*width+x] = sum/count;
    }
  }
  return out;
}

async function tryDecodeVariants(canvas, ctx){
  const w = canvas.width, h = canvas.height;
  const detector = await getBarcodeDetector();
  // 1) native decoder on the raw photo, if available
  if(detector){
    try{
      const results = await detector.detect(canvas);
      if(results && results.length) return results[0].rawValue;
    }catch(e){}
  }
  if(typeof jsQR === 'undefined') return null;
  const base = ctx.getImageData(0,0,w,h);
  // 2) raw grayscale
  let gray = grayscaleBuffer(base);
  let code = jsQR(grayToImageData(gray,w,h).data, w, h);
  if(code && code.data) return code.data;
  // 3) contrast-stretched
  const stretched = contrastStretch(gray);
  code = jsQR(grayToImageData(stretched,w,h).data, w, h);
  if(code && code.data) return code.data;
  // 4) lightly blurred (smooths fine fabric-weave noise) + re-stretched
  const blurred = contrastStretch(boxBlur(gray, w, h, 1));
  code = jsQR(grayToImageData(blurred,w,h).data, w, h);
  if(code && code.data) return code.data;
  return null;
}

async function handlePhotoCapture(e){
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('photo-decode-status');
  if(statusEl) statusEl.innerHTML = `<p class="hint">Reading photo…</p>`;
  try{
    const bitmap = await createImageBitmap(file);
    const maxDim = 2200;
    const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
    const w = Math.round(bitmap.width*scale), h = Math.round(bitmap.height*scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    ctx.drawImage(bitmap, 0, 0, w, h);
    const raw = await tryDecodeVariants(canvas, ctx);
    if(raw){
      if(navigator.vibrate) navigator.vibrate(80);
      if(statusEl) statusEl.innerHTML = '';
      if(!handleScanInput(raw)){
        if(statusEl) statusEl.innerHTML = `<p class="hint" style="color:var(--warn);">Read a code, but couldn't find a product identifier in it. That link may not carry a serial — try re-scanning instead.</p>`;
      }
    } else {
      if(statusEl) statusEl.innerHTML = `<p class="hint" style="color:var(--warn);">Couldn't read a code in that photo. Try retaking it closer/further away with more even light, or use manual entry below.</p>`;
    }
  }catch(err){
    if(statusEl) statusEl.innerHTML = `<p class="hint" style="color:var(--fail);">Couldn't process that photo: ${esc(err.message)}</p>`;
  }
  e.target.value = '';
}

function renderDashboard(){

          <div class="wo-sub">${s.anyTargetSet ? `${s.qty} target units &middot; ` : ''}${s.pass} associated${s.fail?` &middot; ${s.fail} failed`:''}${s.writtenOff?` &middot; ${s.writtenOff} written off`:''}</div>
        </div>
        ${status}
      </div>
      <table>
        <thead><tr><th>Colour</th><th>Size</th><th>SKU</th><th>Assoc.</th><th>Written off</th><th>Target</th><th></th></tr></thead>
        <tbody>
        ${s.sizes.map(sz=>{
          const pct = sz.stats.targetSet && sz.stats.effectiveQty ? Math.round(sz.stats.pass/sz.stats.effectiveQty*100) : 0;
          return `<tr>
            <td>${esc(sz.colour)}</td>
            <td>${esc(sz.size)}</td>
            <td style="color:var(--ink-dim);">${sz.sku ? esc(sz.sku) : '—'}</td>
            <td>${sz.stats.pass}${sz.stats.flagged ? ' <span style="color:var(--fail)">&#9888;</span>' : ''}</td>
            <td style="color:var(--ink-dim);">${sz.stats.writtenOff || '—'}</td>
            <td>${sz.stats.targetSet ? (sz.stats.writtenOff ? `${sz.stats.effectiveQty} <span style="color:var(--ink-dim); font-size:10.5px;">(of ${sz.stats.qty})</span>` : sz.stats.qty) : '<span class="tbd">TBD</span>'}</td>

function renderFlagDetail(wo, stats){
  const missing = [];
  stats.sizes.forEach(sz=>{
    if(sz.stats.flagged){
      serialsForSizeRow(wo, sz).forEach(ser=>{
        if(state.writtenOff[ser]) return; // excluded from target, not a missing unit
        const r = state.records[ser];
        if(!r || r.status!=='pass') missing.push({serial:ser, colour:sz.colour, size:sz.size, status: r ? r.status : 'not scanned'});
      });
    }
  });
  return `<div class="flag-banner" style="margin-top:10px;">
    Every unit in this line has been through QC, but the associated count is short of target.
    Recall these ${missing.length} unit(s) to re-check on the line:
    <table style="margin-top:8px;"><tbody>
      ${missing.map(m=>`<tr><td class="mono">${esc(m.serial)}</td><td>${esc(m.colour)} ${esc(m.size)}</td><td style="color:var(--fail)">${esc(m.status)}</td></tr>`).join('')}
    </tbody></table>
  </div>`;
}

let logFilter = '';

const LOG_SORT_COLS = {
  serial: h => h.serial || '',
  wo: h => h.woNumber || '',
  size: h => `${h.colour||''} ${h.size||''}`,
  status: h => h.status || '',
  source: h => h.source || '',

function logSortHeader(col, label, align){
  const active = logSort.col === col;
  const arrow = active ? (logSort.dir==='asc' ? ' &#9650;' : ' &#9660;') : '';
  return `<th data-sort-col="${col}" style="cursor:pointer; user-select:none; ${align?'text-align:'+align+';':''}">${esc(label)}${arrow}</th>`;
}
function renderLog(){
  const term = logFilter.toLowerCase();
  let rows = state.history.filter(h =>
    !term || h.serial.toLowerCase().includes(term) || (h.woNumber||'').toLowerCase().includes(term)
  );
  const getKey = LOG_SORT_COLS[logSort.col] || LOG_SORT_COLS.ts;
  rows = rows.slice().sort((a,b)=>{
    const ka = getKey(a), kb = getKey(b);
    const cmp = typeof ka === 'number' ? ka-kb : String(ka).localeCompare(String(kb));
    return logSort.dir === 'asc' ? cmp : -cmp;
  });
  return `<div class="card">
    <h2>Scan log</h2>
    <input type="text" id="log-search" class="search-box" placeholder="Filter by serial or WO number" value="${esc(logFilter)}">

      ${logSortHeader('status','Result')}
      ${logSortHeader('source','Src')}
      ${logSortHeader('ts','Time','right')}

    <tbody>${rows.map(h=>`
      <tr>
        <td class="mono">${esc(h.serial)}</td>

        <td style="color:var(--ink-dim);">${esc(h.source||'scan')}</td>
        <td style="text-align:right; color:var(--ink-dim);">${fmtTime(h.ts)}</td>
      </tr>`).join('')}</tbody></table>` : '<div class="empty">No scans recorded yet.</div>'}
  </div>`;
}
function bindLogEvents(){
  document.getElementById('log-search').oninput = (e)=>{ logFilter = e.target.value; render(); document.getElementById('log-search').focus(); };

    th.onclick = () => {
      const col = th.dataset.sortCol;
      if(logSort.col === col) logSort.dir = logSort.dir==='asc' ? 'desc' : 'asc';

}
function exportCSV(){
  const header = ['serial','work_order','colour','size','result','source','timestamp'];
  const lines = [header.join(',')];
  state.history.forEach(h=>{
    lines.push([h.serial, h.woNumber||'', h.colour||'', h.size||'', h.status, h.source||'scan', new Date(h.ts).toISOString()].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `dpp_scan_log_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

    <p class="hint">Labels Work Orders so Dashboard and Work Orders can be filtered to just one season at a time — useful right after importing a report that mixes in an older season's data. Your current S/2027 Work Orders are already tagged. Paste WO numbers (comma or newline separated) and a label below to tag others.</p>
    <label>Work Order numbers</label>
    <textarea id="season-wo-list" rows="3" placeholder="83849, 83870, 83878..." style="width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--ink); padding:10px; border-radius:8px; font-family:var(--mono); font-size:12px; margin-bottom:10px; box-sizing:border-box;"></textarea>
    <label>Season label</label>
    <input type="text" id="season-label-input" placeholder="e.g. F26, Previous season">
    <button class="btn btn-primary" id="btn-apply-season" style="width:100%;">Apply label</button>
  </div>
  <div class="card">
    <h2>Serial pool</h2>
    <div class="stat-grid">
      <div class="stat"><div class="n">${total.toLocaleString()}</div><div class="l">Total loaded</div></div>
      <div class="stat"><div class="n">${assigned.toLocaleString()}</div><div class="l">Assigned</div></div>
      <div class="stat"><div class="n">${unassigned.toLocaleString()}</div><div class="l">Unassigned</div></div>
    </div>
  </div>
  <div class="card">
    <h2>Import Work Order target breakdown</h2>
    <p class="hint">Upload a breakdown export (columns like <span class="mono">WOid</span>, <span class="mono">Model Name</span>, <span class="mono">color</span>, <span class="mono">size</span>, <span class="mono">Sku</span>, and a quantity column such as <span class="mono">Sum of Qty Planned</span>). This sets the target qty for each colour/size line, creating the Work Order if it doesn't exist yet. Existing targets you've already entered are only filled in if blank — this won't overwrite numbers you've already set.</p>
    <input type="file" id="file-import-targets" accept=".xlsx,.xls,.csv">
  </div>
  <div class="card">
    <h2>Import association report</h2>
    <p class="hint">Upload a DPP system export (columns like <span class="mono">Identifier1</span>, <span class="mono">PONumber</span>, <span class="mono">Product.Size</span>, <span class="mono">Product.Color</span>). Each row is treated as a confirmed association: it creates the Work Order if needed, adds the colour/size line, links the serial, and marks it Pass. Rows with no PO number, marked <span class="mono">Nonproduction</span>, or with a PO containing "UAT" are skipped automatically. Safe to re-run whenever you pull a fresh export.</p>
    <input type="file" id="file-import-assoc" accept=".xlsx,.xls,.csv">
  </div>
  <div class="card">
    <h2>Import additional serials</h2>
    <p class="hint">Upload another "URLs and Serials" Excel export to add more serials to the pool (e.g. a new production run). Duplicate serials already in the pool are skipped automatically. Column must be named "Serial".</p>
    <input type="file" id="file-import" accept=".xlsx,.xls,.csv">
  </div>
  <div class="card">
    <h2>Reset data</h2>
    <p class="hint">This clears all Work Orders, scan history, and assignments on this device, and reloads the original ${DEFAULT_SERIALS.length.toLocaleString()}-serial pool. This cannot be undone.</p>
    <button class="btn btn-fail" id="btn-reset" style="width:100%;">Reset all data on this device</button>
  </div>
  <div class="footer-note">${syncStatus==='connected' ? 'Work Orders, associations, and QC checks sync live. The serial pool and Log stay on this device only.' : 'Data is stored only in this browser on this device. Nothing is sent anywhere unless Live sync is connected above.'}</div>`;
}
let correctingSerial = null;

function renderCorrectResult(){
  if(!correctingSerial) return '';
  const serial = correctingSerial;
  const assign = state.assignment[serial];
  const rec = state.records[serial];
  const qc = state.qcChecks[serial];
  const woOptions = state.workOrders.map(w=>`<option value="${w.id}" ${assign && w.id===assign.woId ? 'selected':''}>WO ${esc(w.woNumber)}</option>`).join('');
  return `<div class="wo-card" style="margin-top:10px;">
    <div class="result-serial" style="font-size:16px;">${esc(serial)}</div>
    ${assign ? `
      <p class="hint" style="margin-top:6px;">Currently: WO ${esc(assign.woNumber)} &middot; ${esc(assign.colour)} &middot; ${esc(assign.size)}${rec ? ` &middot; ${esc(rec.status)}` : ''}${qc ? ` &middot; QC checked ${fmtTime(qc.ts)}` : ''}</p>
    ` : `<p class="hint" style="margin-top:6px; color:var(--warn);">Not currently assigned to any Work Order.</p>`}
    ${state.workOrders.length ? `
      <label style="margin-top:8px;">Work Order</label>
      <select id="correct-wo">${woOptions}</select>
      <div class="row">
        <div><label>Colour</label><input type="text" id="correct-colour" value="${esc(assign ? assign.colour : '')}" placeholder="e.g. Cabernet"></div>
        <div><label>Size</label><input type="text" id="correct-size" value="${esc(assign ? assign.size : '')}" placeholder="e.g. M"></div>
      </div>
      <button class="btn btn-primary" id="btn-correct-save" style="width:100%;">Save correction</button>
    ` : `<p class="hint">No Work Orders exist yet.</p>`}
  </div>`;
}

function saveCorrection(){
  const serial = correctingSerial;
  const woId = document.getElementById('correct-wo').value;
  const colour = document.getElementById('correct-colour').value.trim();
  const size = document.getElementById('correct-size').value.trim();
  if(!colour || !size){ alert('Enter both colour and size.'); return; }
  const wo = findWO(woId);
  if(!wo) return;
  findOrCreateSizeRow(wo, colour, size);
  state.assignment[serial] = { woId: wo.id, woNumber: wo.woNumber, colour, size };
  if(state.records[serial]){
    state.records[serial] = { ...state.records[serial], woId: wo.id, woNumber: wo.woNumber, colour, size };
  }
  save();
  pushAssignment(serial);
  pushRecord(serial);
  pushWO(wo);
  alert('Corrected — synced to every connected device.');
  correctingSerial = null;
  render();
}

let writeOffingSerial = null;

function renderWriteOffResult(){
  if(!writeOffingSerial) return '';
  const serial = writeOffingSerial;
  const assign = state.assignment[serial];
  const existing = state.writtenOff[serial];
  if(existing){
    return `<div class="wo-card" style="margin-top:10px;">
      <div class="result-serial" style="font-size:16px;">${esc(serial)}</div>
      <p class="hint" style="margin-top:6px; color:var(--warn);">Already written off — ${esc(existing.reason)} at ${fmtTime(existing.ts)}${existing.woNumber ? ` &middot; was WO ${esc(existing.woNumber)} ${esc(existing.colour)} ${esc(existing.size)}` : ''}.</p>
      <button class="btn btn-fail" id="btn-undo-writeoff" style="width:100%;">Undo write-off</button>
    </div>`;
  }
  const woOptions = state.workOrders.map(w=>`<option value="${w.id}" ${assign && w.id===assign.woId ? 'selected':''}>WO ${esc(w.woNumber)}</option>`).join('');
  return `<div class="wo-card" style="margin-top:10px;">
    <div class="result-serial" style="font-size:16px;">${esc(serial)}</div>
    <p class="hint" style="margin-top:6px;">${assign ? `Currently: WO ${esc(assign.woNumber)} &middot; ${esc(assign.colour)} &middot; ${esc(assign.size)}` : 'Not currently assigned to a Work Order — you can still write it off, optionally tagging which WO/colour/size it came from for reporting.'}</p>
    <label style="margin-top:8px;">Reason</label>
    <select id="writeoff-reason">
      <option value="Quality defect">Quality defect</option>
      <option value="Reference sample">Reference sample</option>
    </select>
    ${state.workOrders.length ? `
      <label style="margin-top:8px;">Work Order ${assign ? '' : '(optional)'}</label>
      <select id="writeoff-wo">
        <option value="">— none —</option>
        ${woOptions}
      </select>
      <div class="row">
        <div><label>Colour</label><input type="text" id="writeoff-colour" value="${esc(assign ? assign.colour : '')}" placeholder="e.g. Cabernet"></div>
        <div><label>Size</label><input type="text" id="writeoff-size" value="${esc(assign ? assign.size : '')}" placeholder="e.g. M"></div>
      </div>
    ` : ''}
    <button class="btn btn-fail" id="btn-writeoff-save" style="width:100%; margin-top:8px;">Write off this unit</button>
  </div>`;
}

function saveWriteOff(){
  const serial = writeOffingSerial;
  const reason = document.getElementById('writeoff-reason').value;
  const woEl = document.getElementById('writeoff-wo');
  const woId = woEl ? woEl.value : '';
  const colour = document.getElementById('writeoff-colour') ? document.getElementById('writeoff-colour').value.trim() : '';
  const size = document.getElementById('writeoff-size') ? document.getElementById('writeoff-size').value.trim() : '';
  if(woId && (!colour || !size)){ alert('If you pick a Work Order, enter both colour and size too.'); return; }
  writeOffSerial(serial, reason, woId || null, colour, size);
  alert('Written off — synced to every connected device.');
  writeOffingSerial = null;
  render();
}

function bindSettingsEvents(){
  document.getElementById('file-import').onchange = handleImportFile;
  document.getElementById('file-import-assoc').onchange = handleImportAssociationReport;
  document.getElementById('file-import-targets').onchange = handleImportTargetBreakdown;
  const correctLookupBtn = document.getElementById('btn-correct-lookup');
  const correctInput = document.getElementById('correct-serial-input');
  if(correctLookupBtn) correctLookupBtn.onclick = () => {
    const val = correctInput.value.trim();
    if(!val){ alert('Enter a serial.'); return; }
    correctingSerial = val;
    render();
  };
  if(correctInput) correctInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ correctLookupBtn.click(); }});
  const correctSaveBtn = document.getElementById('btn-correct-save');
  if(correctSaveBtn) correctSaveBtn.onclick = saveCorrection;
  const writeOffLookupBtn = document.getElementById('btn-writeoff-lookup');
  const writeOffInput = document.getElementById('writeoff-serial-input');
  if(writeOffLookupBtn) writeOffLookupBtn.onclick = () => {
    const val = writeOffInput.value.trim();
    if(!val){ alert('Enter a serial.'); return; }
    writeOffingSerial = val;
    render();
  };
  if(writeOffInput) writeOffInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ writeOffLookupBtn.click(); }});
  const writeOffSaveBtn = document.getElementById('btn-writeoff-save');
  if(writeOffSaveBtn) writeOffSaveBtn.onclick = saveWriteOff;
  const undoWriteOffBtn = document.getElementById('btn-undo-writeoff');
  if(undoWriteOffBtn) undoWriteOffBtn.onclick = () => {
    undoWriteOff(writeOffingSerial);
    writeOffingSerial = null;
    render();
  };
  const cleanupBtn = document.getElementById('btn-cleanup-dupes');
  if(cleanupBtn) cleanupBtn.onclick = () => {
    if(confirm('Scan for and merge duplicate Work Orders now?')) cleanupDuplicateWorkOrders();
  };
  const applySeasonBtn = document.getElementById('btn-apply-season');
  if(applySeasonBtn) applySeasonBtn.onclick = () => {
    const listRaw = document.getElementById('season-wo-list').value;
    const label = document.getElementById('season-label-input').value.trim();
    if(!label){ alert('Enter a season label.'); return; }
    const woNumbers = listRaw.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
    if(!woNumbers.length){ alert('Enter at least one Work Order number.'); return; }
    let matched = 0;
    woNumbers.forEach(num=>{
      const wo = state.workOrders.find(w=>w.woNumber===num);
      if(wo){ wo.season = label; pushWO(wo); matched++; }
    });
    save();
    alert(`Tagged ${matched} of ${woNumbers.length} Work Order(s) as "${label}". ${woNumbers.length-matched} weren't found.`);
    render();
  };
  const fbConnectBtn = document.getElementById('btn-fb-connect');
  const fbDisconnectBtn = document.getElementById('btn-fb-disconnect');
  if(fbConnectBtn) fbConnectBtn.onclick = () => {
    const raw = document.getElementById('fb-config-input').value.trim();
    let cfg;
    try{ cfg = JSON.parse(raw); }
    catch(e){ alert('That doesn\'t look like valid config — paste the full {...} object from Firebase, exactly as copied.'); return; }
    saveFirebaseConfig(cfg);
    initFirebaseSync(cfg);
  };
  if(fbDisconnectBtn) fbDisconnectBtn.onclick = () => {
    if(!confirm('Disconnect live sync on this device? Local data stays put, but this device will stop sending or receiving updates.')) return;
    clearFirebaseConfig();
    db = null; syncStatus = 'disconnected'; syncError = null; syncListenersAttached = false;
    render();
  };
  document.getElementById('btn-reset').onclick = () => {
    if(confirm('Reset ALL data on this device? This cannot be undone.')){
      if(confirm('Really sure? Work Orders and scan history will be permanently lost.')){
        state = freshState();
        save();
        render();
      }
    }
  };
}
function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try{
      const wb = XLSX.read(evt.target.result, {type:'array'});
      let added = 0;
      wb.SheetNames.forEach(name=>{
        const ws = wb.Sheets[name];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1});
        const header = rows[0] || [];
        const col = header.findIndex(h => String(h).trim().toLowerCase() === 'serial');
        if(col === -1) return;
        for(let i=1;i<rows.length;i++){
          const v = rows[i][col];
          if(v && !state.pool.includes(String(v).trim())){
            state.pool.push(String(v).trim());
            added++;
          }
        }
      });
      save();
      alert(`Added ${added} new serial(s) to the pool.`);
      render();
    }catch(err){
      alert('Could not read that file: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function colIdx(header, name){
  return header.findIndex(h => String(h||'').trim().toLowerCase() === name.toLowerCase());
}

function handleImportAssociationReport(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try{
      const wb = XLSX.read(evt.target.result, {type:'array'});
      let created=0, updated=0, skippedNoPO=0, skippedTest=0;
      const touchedWOs = {}, touchedAssignments = {}, touchedRecords = {}, touchedHistory = {};
      wb.SheetNames.forEach(name=>{
        const ws = wb.Sheets[name];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1});
        const header = rows[0] || [];
        const cId = colIdx(header,'Identifier1');
        const cPO = colIdx(header,'PONumber');
        const cSize = colIdx(header,'Product.Size');
        const cColor = colIdx(header,'Product.Color');
        // the source system exports two differently-cased nonproduction columns; check both
        const cNonProdIdxs = header.map((h,i)=> String(h||'').trim().toLowerCase()==='field.nonproduction' ? i : -1).filter(i=>i>-1);
        const cCreated = colIdx(header,'CreatedTime');
        if(cId===-1 || cPO===-1 || cSize===-1 || cColor===-1) return; // not this report format on this sheet
        for(let i=1;i<rows.length;i++){
          const row = rows[i];
          const serial = row[cId] ? String(row[cId]).trim() : '';
          const po = row[cPO];
          const nonProd = cNonProdIdxs.some(ci => row[ci] && String(row[ci]).trim().toLowerCase()==='yes');
          if(!serial) continue;
          if(po===undefined || po===null || String(po).trim()===''){ skippedNoPO++; continue; }
          if(String(po).toLowerCase().includes('uat') || nonProd){ skippedTest++; continue; }
          const woNumber = String(po).trim();
          const colour = row[cColor] ? String(row[cColor]).trim() : '(no colour)';
          const size = row[cSize] ? String(row[cSize]).trim() : '(no size)';
          const ts = cCreated>-1 && row[cCreated] ? (Date.parse(row[cCreated]) || Date.now()) : Date.now();

          const wo = findOrCreateWO(woNumber);
          findOrCreateSizeRow(wo, colour, size);
          touchedWOs[wo.id] = wo;
          const isNewSerial = !state.assignment[serial];
          state.assignment[serial] = { woId: wo.id, woNumber, colour, size };
          touchedAssignments[serial] = state.assignment[serial];
          if(!state.pool.includes(serial)) state.pool.push(serial);
          const wasPass = state.records[serial] && state.records[serial].status==='pass';
          state.records[serial] = { status:'pass', ts, size, woId:wo.id, woNumber, colour, source:'import' };
          touchedRecords[serial] = state.records[serial];
          if(isNewSerial || !wasPass){
            const histEntry = { serial, ts, status:'pass', woNumber, size, colour, source:'import' };
            state.history.unshift(histEntry);
            touchedHistory[historyKey(histEntry)] = histEntry;
            updated++;
          }
          if(isNewSerial) created++;
        }
      });
      save();
      pushBatchDocs('workOrders', touchedWOs);
      pushBatchDocs('assignment', touchedAssignments);
      pushBatchDocs('records', touchedRecords);
      pushBatchDocs('history', touchedHistory);
      state.lastSyncedAt = Date.now(); save();
      alert(`Import complete.\n${created} new serial(s) linked, ${updated} association record(s) written.\nSkipped: ${skippedNoPO} with no PO number, ${skippedTest} test/UAT/non-production rows.`);
      render();
    }catch(err){
      alert('Could not read that file: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function fuzzyColIdx(header, candidates){
  const lower = header.map(h => String(h||'').trim().toLowerCase());
  for(const c of candidates){
    const i = lower.indexOf(c.toLowerCase());
    if(i>-1) return i;
  }
  // fallback: partial contains match (e.g. any header containing "qty")
  for(const c of candidates){
    const i = lower.findIndex(h => h.includes(c.toLowerCase()));
    if(i>-1) return i;
  }
  return -1;
}

function handleImportTargetBreakdown(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try{
      const wb = XLSX.read(evt.target.result, {type:'array'});
      let woCreated=0, rowsSet=0, rowsSkippedBlank=0, rowsNoWO=0;
      const touchedWOs = {};
      wb.SheetNames.forEach(name=>{
        const ws = wb.Sheets[name];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1});
        // find the real header row: first row that contains a WOid-like column
        let headerRowIdx = rows.findIndex(r => fuzzyColIdx(r, ['woid','wo id','wo#','wo number','work order']) > -1);
        if(headerRowIdx === -1) return; // this sheet isn't a breakdown table
        const header = rows[headerRowIdx];
        const cWO = fuzzyColIdx(header, ['woid','wo id','wo#','wo number','work order']);
        const cModel = fuzzyColIdx(header, ['model name','model']);
        const cColor = fuzzyColIdx(header, ['color','colour']);
        const cSize = fuzzyColIdx(header, ['size']);
        const cSku = fuzzyColIdx(header, ['sku']);
        const cQty = fuzzyColIdx(header, ['sum of qty planned','qty planned','quantity','qty']);
        if(cWO===-1 || cColor===-1 || cSize===-1 || cQty===-1) return;
        // pivot-style exports repeat WOid/color only on the first row of each group and leave it blank below —
        // carry the last seen value forward for those columns.
        let lastWO='', lastModel='', lastColor='';
        for(let i=headerRowIdx+1;i<rows.length;i++){
          const row = rows[i];
          if(!row || !row.length) continue;
          const rawWO = row[cWO]!=null && row[cWO]!=='' ? String(row[cWO]).trim() : '';
          const rawModel = cModel>-1 && row[cModel]!=null && row[cModel]!=='' ? String(row[cModel]).trim() : '';
          const rawColor = row[cColor]!=null && row[cColor]!=='' ? String(row[cColor]).trim() : '';
          if(rawWO) lastWO = rawWO;
          if(rawModel) lastModel = rawModel;
          if(rawColor) lastColor = rawColor;
          const sizeRaw = row[cSize];
          const qtyRaw = row[cQty];
          if(!sizeRaw || qtyRaw==null || qtyRaw==='') { continue; }
          if(String(lastWO).toLowerCase()==='grand total' || !lastWO){ rowsNoWO++; continue; }
          const qty = Number(String(qtyRaw).replace(/[^0-9.-]/g,''));
          if(!isFinite(qty)){ rowsSkippedBlank++; continue; }
          const size = normalizeSize(sizeRaw);
          const sku = cSku>-1 && row[cSku]!=null ? String(row[cSku]).trim() : null;

          const existedBefore = state.workOrders.some(w=>w.woNumber===lastWO);
          const wo = findOrCreateWO(lastWO, lastModel);
          if(!existedBefore) woCreated++;
          const sizeRow = findOrCreateSizeRow(wo, lastColor, size, sku);
          if(!sizeRow.qty) sizeRow.qty = qty;
          touchedWOs[wo.id] = wo;
          rowsSet++;
        }
      });
      save();
      pushBatchDocs('workOrders', touchedWOs);
      alert(`Import complete.\n${woCreated} Work Order(s) created, ${rowsSet} colour/size target(s) set.\n${rowsNoWO} row(s) skipped (no Work Order number), ${rowsSkippedBlank} row(s) with an unreadable quantity.`);
      render();
    }catch(err){
      alert('Could not read that file: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ============================= INIT ============================= */
render();

// Auto-connect to a previously-saved Firebase config, if this device has one.
// Deliberately placed at the very end of the script: initFirebaseSync() triggers render(),
// which depends on state declared throughout this file — calling it any earlier risks a
// "cannot access before initialization" error on variables not yet reached.
{
  const savedFbConfig = loadFirebaseConfig();
  if(savedFbConfig) initFirebaseSync(savedFbConfig);
}

// Accepts a serial/URL handed in via ?scan=... (e.g. from an iOS Shortcut using Apple's
// own native barcode scanner) and shows the result immediately, no typing or pasting needed.
(function handleIncomingScanParam(){
  try{
    const params = new URLSearchParams(location.search);
    if(params.has('scan')){
      const raw = params.get('scan');
      history.replaceState({}, '', location.pathname);
      handleScanInput(raw);
    }
  }catch(e){ /* no-op — malformed param shouldn't break the app */ }
})();
</script>
